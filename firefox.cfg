// IMPORTANT: keep this first line as a comment — AutoConfig always ignores line 1.
//
// This file runs as privileged chrome JavaScript at Firefox startup. It adds
// toolbar buttons. No extension and no fx-autoconfig framework required.
//
// SECURITY NOTE: general.config.sandbox_enabled=false (set in autoconfig.js)
// gives this file FULL browser privileges. Only ever put code you trust here.

try {
  const Cc = Components.classes;
  const Ci = Components.interfaces;

  // The .cfg runs VERY early in startup — before browser-only modules like
  // resource:///modules/CustomizableUI.sys.mjs are registered — so importing it
  // at this point fails with "Failed to load ...". Defer widget creation until
  // the first browser window has finished initializing, when it's available.
  const obs = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);
  const onWindowReady = {
    observe(win) {
      obs.removeObserver(onWindowReady, "browser-delayed-startup-finished");
      try {
        buildWidgets(win);
      } catch (e) {
        Components.utils.reportError("firefox.cfg buildWidgets: " + e);
      }
    },
  };
  obs.addObserver(onWindowReady, "browser-delayed-startup-finished");

  // Get CustomizableUI without hard-coding a module path (they shift between
  // Firefox versions - resource:///modules/ was retired for moz-src:///).
  // Prefer the browser window's own global, then try the current + legacy URIs.
  function getCustomizableUI(win) {
    if (win && win.CustomizableUI) {
      return win.CustomizableUI;
    }
    for (const uri of [
      "moz-src:///browser/components/customizableui/CustomizableUI.sys.mjs",
      "resource:///modules/CustomizableUI.sys.mjs",
    ]) {
      try {
        return ChromeUtils.importESModule(uri).CustomizableUI;
      } catch (e) {}
    }
    return null;
  }

  // createWidget registers globally (all current + future windows), so we only
  // run this once, on the first ready window (whose subject `win` we're passed).
  function buildWidgets(win) {
    const CustomizableUI = getCustomizableUI(win);
    if (!CustomizableUI) {
      throw new Error("could not obtain CustomizableUI (window global + module imports all failed)");
    }

    // Both custom icons point at built-in Firefox chrome:// SVGs. Because those
    // are privileged, same-origin images, context-fill inside them resolves to
    // the themed toolbar colour automatically: the built-in .toolbarbutton-1 rule
    // already sets -moz-context-properties:fill and fill:var(--toolbarbutton-icon-
    // fill), and a chrome:// image is allowed to read that context paint. (An
    // inline data: URL has an opaque origin, so context-fill is disabled for it
    // and the icon renders black — that's why we don't embed our own SVGs here.)

    // ── Performance button: opens about:performance ──────────────────────────
    const ICON = "chrome://global/skin/icons/performance.svg"; // speedometer + needle

    CustomizableUI.createWidget({
      id: "about-performance-button",
      label: "Performance",
      tooltiptext: "Open about:performance (Task Manager)",
      defaultArea: CustomizableUI.AREA_NAVBAR,
      onCreated(node) {
        node.style.listStyleImage = 'url("' + ICON + '")';
      },
      onCommand(event) {
        // Resolve the CLICKED window. ownerGlobal is chrome-only and hidden by
        // the autoconfig sandbox's Xray wrappers, so use the standard
        // ownerDocument.defaultView; then waive Xrays so chrome-only props
        // (gBrowser, tab.linkedBrowser) are actually reachable.
        const node = event && event.target;
        let win =
          (node && node.ownerDocument && node.ownerDocument.defaultView) ||
          Cc["@mozilla.org/appshell/window-mediator;1"]
            .getService(Ci.nsIWindowMediator)
            .getMostRecentWindow("navigator:browser");
        if (!win) return;
        win = Components.utils.waiveXrays(win);
        const gBrowser = win.gBrowser;
        if (!gBrowser) return;
        // about:performance redirects to about:processes on current Firefox, so
        // match EITHER when reusing an existing Task Manager tab in THIS window.
        const openUrl = "about:performance";
        const match = ["about:performance", "about:processes"];
        for (const tab of gBrowser.tabs) {
          const b = tab.linkedBrowser;
          if (b && b.currentURI && match.includes(b.currentURI.spec)) {
            gBrowser.selectedTab = tab;
            return;
          }
        }
        win.openTrustedLinkIn(openUrl, "tab");
      },
    });

    // ── "Layout" menu button: a per-window show/hide toggle per option ───────
    // Clicking opens a menu of checkbox items; each flips an attribute on THIS
    // window's root. userChrome.css gates the matching rules on
    // :root:not([that-attribute]), so unchecked/absent = hidden (default),
    // checked/present = shown. Per window; new windows start hidden.
    // Add a new toggle by appending {label, attr} here and a matching
    // :root:not([attr]) rule in userChrome.css — nothing else to touch.
    const TOGGLES = [
      { label: "Tab bar", attr: "uc-show-tabbar" },
      { label: "Sidebar header", attr: "uc-show-sidebar-header" },
    ];

    const TOGGLES_ICON = "chrome://global/skin/icons/columnpicker.svg"; // columns + dropdown

    CustomizableUI.createWidget({
      id: "uc-layout-toggles-button",
      type: "custom",
      defaultArea: CustomizableUI.AREA_NAVBAR,
      onBuild(doc) {
        const root = doc.documentElement;
        const btn = doc.createXULElement("toolbarbutton");
        btn.id = "uc-layout-toggles-button";
        btn.className = "toolbarbutton-1 chromeclass-toolbar-additional";
        btn.setAttribute("type", "menu");
        btn.setAttribute("label", "Layout");
        btn.setAttribute("tooltiptext", "Show/hide layout bits (this window)");
        btn.style.listStyleImage = 'url("' + TOGGLES_ICON + '")';

        const popup = doc.createXULElement("menupopup");
        // Drive the checkmark via the `checked` ATTRIBUTE, not the .checked
        // property (the sandbox's Xray wrapper won't set the JS property, but
        // setAttribute/removeAttribute pass through fine).
        const reflect = (mi, on) =>
          on ? mi.setAttribute("checked", "true") : mi.removeAttribute("checked");
        for (const t of TOGGLES) {
          const mi = doc.createXULElement("menuitem");
          mi.setAttribute("type", "checkbox");
          mi.setAttribute("autocheck", "false"); // we flip it explicitly below
          mi.setAttribute("label", t.label);
          mi.addEventListener("command", () => {
            // Toggle the attribute on this window's root; reflect the new state.
            reflect(mi, root.toggleAttribute(t.attr));
          });
          popup.appendChild(mi);
        }
        // Reflect the current per-window state each time the menu opens.
        popup.addEventListener("popupshowing", () => {
          let i = 0;
          for (const mi of popup.children) {
            reflect(mi, root.hasAttribute(TOGGLES[i++].attr));
          }
        });

        btn.appendChild(popup);
        return btn;
      },
    });
  }
} catch (e) {
  Components.utils.reportError("firefox.cfg: " + e);
}
